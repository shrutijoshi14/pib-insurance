<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PIB Insurance</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query string
      // into just a query string, and then redirects the browser to the new url
      // with only a query string and hash fragment, e.g.
      // http://www.foo.tld/one/two?a=b#anchor -> http://www.foo.tld/?p=/one/two&q=a=b#anchor
      // Note: this is done before the script in index.html is run, which will
      // convert the query string back into a path and query string of the
      // original url and add it to the browser's history using window.history.replaceState
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
